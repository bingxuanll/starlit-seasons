<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0f">
  <meta name="description" content="唱针扫过宇宙中的一片草地，春夏秋冬依次铺开。">
  <title>星野唱片 · 四季轮转</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="scene.js" defer></script>
</head>
<body>
  <main class="viewer">
    <div class="nebula" aria-hidden="true"></div>
    <canvas id="meteors" aria-hidden="true"></canvas>
    <canvas id="world" role="img" aria-label="星空中悬浮的黑色唱片，金色唱针扫过真实的立体草叶，逐圈铺开四季。草地上的黑猫和浅色小狗正在追逐。"></canvas>

    <header class="header">
      <div class="title">
        <i class="record-mark" aria-hidden="true"></i>
        <h1>星野唱片</h1>
      </div>
      <button type="button" id="fullscreen" class="icon-button" aria-label="全屏播放" title="全屏播放">
        <i class="fullscreen-icon" aria-hidden="true"></i>
      </button>
    </header>

    <div id="unavailable" class="unavailable" hidden>当前浏览器无法播放立体场景。</div>

    <div class="console" id="controls">
      <div class="timeline" aria-hidden="true"><div id="progress"></div></div>
      <div class="control-row">
        <div class="seasons" role="group" aria-label="切换季节">
          <button class="season" data-season="0" aria-pressed="true" type="button"><i aria-hidden="true"></i>春</button>
          <button class="season" data-season="1" aria-pressed="false" type="button"><i aria-hidden="true"></i>夏</button>
          <button class="season" data-season="2" aria-pressed="false" type="button"><i aria-hidden="true"></i>秋</button>
          <button class="season" data-season="3" aria-pressed="false" type="button"><i aria-hidden="true"></i>冬</button>
        </div>
        <button type="button" id="play" class="icon-button play" aria-label="暂停" title="播放 / 暂停（空格）"><i aria-hidden="true"></i></button>
      </div>
    </div>
  </main>
</body>
</html>
